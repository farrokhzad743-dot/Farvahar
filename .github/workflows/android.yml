name: Android Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_bundle:
        description: "Build signed Android App Bundle (AAB)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    name: Validate app files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate required files
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s manifest.webmanifest
          test -s assets/faravahar.svg
          node --check app.js
          node --check functions/api/translate.js
          node --check functions/api/exchange-rate.js

  android:
    name: Build Android APK / AAB
    needs: validate-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Prepare Capacitor web assets
        run: |
          mkdir -p www/assets
          cp index.html app.js styles.css manifest.webmanifest sw.js www/
          cp -R assets/. www/assets/
      - name: Add Android platform if not present
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Apply Faravahar launcher icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            cp "assets/android-icons/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "assets/android-icons/mipmap-${density}/ic_launcher_round.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp assets/android-icons/mipmap-xxxhdpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#12392F</color></resources>
          EOF
      - name: Set Android 10 minimum
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/minSdkVersion = 23/minSdkVersion = 29/' android/variables.gradle
            sed -i 's/minSdkVersion = 22/minSdkVersion = 29/' android/variables.gradle
          fi
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Prepare signing key (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/faravahar-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/faravahar-release.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore configured; debug APK build remains available."
          fi
      - name: Build debug APK
        if: ${{ !inputs.release_bundle }}
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Build release AAB
        if: ${{ inputs.release_bundle }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PATH" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release bundle requires all four Android signing secrets." >&2
            exit 1
          fi
          ./gradlew --no-daemon bundleRelease
      - name: Sign release bundle
        if: ${{ inputs.release_bundle }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          jarsigner -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Upload APK artifact
        if: ${{ !inputs.release_bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: faravahar-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload AAB artifact
        if: ${{ inputs.release_bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: faravahar-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
