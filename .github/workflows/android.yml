name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate repository files
        run: |
          test -s package.json || { echo 'Missing package.json at repository root'; exit 1; }
          test -s capacitor.config.ts || { echo 'Missing capacitor.config.ts at repository root'; exit 1; }
          test -s index.html || { echo 'Missing index.html at repository root'; exit 1; }
          test -s app.js || { echo 'Missing app.js at repository root'; exit 1; }
          test -s styles.css || { echo 'Missing styles.css at repository root'; exit 1; }
          node --check app.js
          node --check functions/api/translate.js
          node --check functions/api/exchange-rate.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www/assets
          cp index.html app.js styles.css www/
          [ ! -f manifest.webmanifest ] || cp manifest.webmanifest www/
          [ ! -f sw.js ] || cp sw.js www/
          [ ! -d assets ] || cp -R assets/. www/assets/

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Set minimum Android version to 10
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 29/' android/variables.gradle
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 29/' android/app/build.gradle
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: faravahar-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
